<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://servekerala.in/multi-view.html" />

  <!-- Open Graph / Social Tags -->
  <meta property="og:title" content="Responsive Multi-View | ServeKerala.in" />
  <meta property="og:description" content="ServeKerala connects you directly with verified local professionals." />
  <meta property="og:image" content="https://servekerala.in/assets/images/logo.png?v=2" />
  <meta property="og:url" content="https://servekerala.in/multi-view.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Responsive Multi-View | ServeKerala.in" />
  <meta name="twitter:description" content="ServeKerala connects you directly with verified local professionals." />
  <meta name="twitter:image" content="https://servekerala.in/assets/images/logo.png?v=2" />
  <title>Responsive Multi-View | ServeKerala.in</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 16px 24px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
    }
    .url-bar {
      display: flex;
      gap: 12px;
      flex: 1;
      max-width: 600px;
      margin: 0 24px;
    }
    .url-bar input {
      flex: 1;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #334155;
      color: white;
      font-size: 14px;
    }
    .url-bar button {
      padding: 8px 24px;
      border-radius: 6px;
      border: none;
      background: #0ea5e9;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .url-bar button:hover {
      background: #0284c7;
    }
    .devices-container {
      display: flex;
      gap: 30px;
      padding: 30px;
      overflow-x: auto;
      flex: 1;
      align-items: flex-start;
    }
    .device {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .device-label {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }
    .device-frame {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      border: 2px solid #334155;
    }
    iframe {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 4px;
    }
    
    /* Device Sizes */
    .mobile iframe { width: 375px; height: 812px; }
    .tablet iframe { width: 768px; height: 1024px; }
    .desktop iframe { width: 1280px; height: 800px; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { height: 12px; width: 12px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>

  <div class="header">
    <h1>📱 Multi-View Testing</h1>
    <div class="url-bar">
      <input type="text" id="url-input" value="/" placeholder="Enter path (e.g. / or /auto-mithram/)">
      <button onclick="updateIframes()">Reload Frames</button>
    </div>
    <a href="/" style="color: #94a3b8; text-decoration: none;">Exit to Site &rarr;</a>
  </div>

  <div class="devices-container">
    
    <!-- Mobile View -->
    <div class="device mobile">
      <div class="device-label">iPhone (375 × 812)</div>
      <div class="device-frame">
        <iframe src="/" id="frame-mobile"></iframe>
      </div>
    </div>

    <!-- Tablet View -->
    <div class="device tablet">
      <div class="device-label">iPad (768 × 1024)</div>
      <div class="device-frame">
        <iframe src="/" id="frame-tablet"></iframe>
      </div>
    </div>

    <!-- Desktop View -->
    <div class="device desktop">
      <div class="device-label">Laptop (1280 × 800)</div>
      <div class="device-frame">
        <iframe src="/" id="frame-desktop"></iframe>
      </div>
    </div>

  </div>

  <script>
    function updateIframes() {
      const url = document.getElementById('url-input').value || '/';
      document.getElementById('frame-mobile').src = url;
      document.getElementById('frame-tablet').src = url;
      document.getElementById('frame-desktop').src = url;
    }

    // Allow pressing Enter in the input
    document.getElementById('url-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        updateIframes();
      }
    });
  </script>

<footer class="site-footer">

      <a href="/contact/">Contact Us</a>
    </nav>
  </div>
</footer>

</body>
</html>
